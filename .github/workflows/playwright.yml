name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Spec file or pattern to run (empty = full suite)'
        required: false
        default: ''
  schedule:
    - cron: '30 13 * * *'

jobs:
  test:
    timeout-minutes: 60
    # Use self-hosted runner if available, else fall back to ubuntu-latest
    # (which will FAIL on network calls — that's expected for now).
    runs-on: ${{ github.event.repository.owner.login == 'your-org' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Generate fixtures
        run: node scripts/generate-fixtures.js
      - name: Run tests
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -n "${{ inputs.target }}" ]; then
            npx playwright test --project=chromium --workers=1 "${{ inputs.target }}"
          else
            npx playwright test --project=chromium --workers=1
          fi
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            logs/run-*.html
            logs/run-*.log
          retention-days: 30
      - name: Send Daily Report Email
        if: ${{ always() }}
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node tests/send-report-email.js
