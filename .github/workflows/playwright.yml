name: Playwright Tests

# These tests target a private deployed server (https://187.77.79.40.nip.io/)
# that is NOT reachable from GitHub-hosted runners. They are intended to run
# locally (on a developer machine or a self-hosted runner that has network
# access to the deployed app).
#
# Trigger: only manual dispatch, never on push/PR.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Spec file or pattern to run (empty = full suite)'
        required: false
        default: ''
  schedule:
    # 7 PM IST (1:30 PM UTC) daily — only works if a self-hosted runner is attached
    - cron: '30 13 * * *'

jobs:
  test:
    timeout-minutes: 60
    # Use self-hosted runner if available, else fall back to ubuntu-latest
    # (which will FAIL on network calls — that's expected for now).
    runs-on: ${{ github.event.repository.owner.login == 'your-org' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run tests
        run: |
          if [ -n "${{ inputs.target }}" ]; then
            npx playwright test --project=chromium --workers=1 "${{ inputs.target }}"
          else
            npx playwright test --project=chromium --workers=1
          fi
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            logs/run-*.html
            logs/run-*.log
          retention-days: 30
